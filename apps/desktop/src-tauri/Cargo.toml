[package]
name = "lock-in"
version = "0.1.0"
description = "Lock In — a free, open-source focus app"
authors = ["SortelOne"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/lock-in-focus-app/lock-in"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lock_in_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.6"
tauri-plugin-single-instance = "2.5"
# The hotkey that opens the satellite box from anywhere.
tauri-plugin-global-shortcut = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["time", "io-util", "sync", "macros"] }
ts-rs = "12"
interprocess = { version = "2.4", features = ["tokio"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
# Finding and closing browsers that run without the extension during a session.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Reading the system's idle time, quitting and hiding apps the way macOS does, hearing when
# apps launch, reading app bundles, and the first day of the week. All are already used inside Tauri, so they add no new
# crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSCalendar", "NSNotification", "NSOperation", "NSString"] }
block2 = "0.6"
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
