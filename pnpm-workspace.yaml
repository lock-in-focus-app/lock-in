packages:
  - apps/*
  - packages/*

# Only install releases at least two weeks old (in minutes), which gives a bad release time to be
# noticed and pulled first. Dependabot's cooldown (.github/dependabot.yml) matches it.
minimumReleaseAge: 20160
# Security fixes don't wait. These have advisories against every release old enough, and are
# exempt until their fixes are two weeks old (after 9 November 2026, node-forge after 10 November);
# then remove them.
minimumReleaseAgeExclude:
  - undici # GHSA-xjj6-f33q-929c, fixed in 8.12.2
  - simple-git # GHSA-x6jw-m9v5-85vh and others, fixed in 4.0.1, through Nuxt's devtools
  - '@simple-git/*'
  - '@nuxt/devtools*'
  - node-forge # GHSA-5x38-2vff-x55p and four others, fixed in 1.4.1, through Nuxt's dev server

allowBuilds:
  esbuild: false
  # Its install script downloads Chrome. The browser tests fetch it explicitly instead.
  puppeteer: false
