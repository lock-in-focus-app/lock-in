# Opens pull requests that update dependencies. Each runs CI, so they come once a month and
# grouped, to save Actions minutes. The cooldown skips releases younger than two weeks, which
# gives a bad release time to be noticed and pulled first. Security fixes don't wait for either.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
