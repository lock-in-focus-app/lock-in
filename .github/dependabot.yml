# Opens pull requests that update dependencies. Each runs CI, so they come once a month as one
# grouped PR per ecosystem (npm, cargo, GitHub Actions), majors included, to save Actions minutes.
# The cooldown skips releases younger than two weeks, which gives a bad release time to be noticed
# and pulled first. Security fixes don't wait for either.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
    ignore:
      # The Node types follow the Node version we run (CI uses 24), not the newest one.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 has no compiler API until 7.1, and vue-tsc, typescript-eslint, WXT and Nuxt
      # need one. Until they support 7, only packages/* use it; the root and the apps stay on 6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # zbus 6 moved the blocking API that idle.rs uses on Linux, so it's a change by hand, not a bump.
      - dependency-name: zbus
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
