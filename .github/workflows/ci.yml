name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit, not a tag like @v5, so a moved or hijacked tag can't change
# what runs here. Dependabot keeps the pins up to date; the comment after each is its version.

# A newer push to the same branch cancels the run it replaces, to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Usually about 2 minutes. GitHub's default limit is 6 hours, which a hung step would use up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known security problems in what ships to users. Dev tools (Puppeteer, web-ext) are left
      # out: several have reports with no fix yet, and they never reach anyone's browser.
      # pnpm-workspace.yaml lists any report that is ignored, and why.
      - run: pnpm audit --prod --audit-level high

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @lock-in/extension build:firefox

      - name: Browser tests
        run: |
          pnpm --filter @lock-in/extension exec puppeteer browsers install chrome
          pnpm test:e2e
