name: Desktop

# Building the Rust core takes a while, so this only runs when something it uses changes:
# the desktop app, packages/core (its generated types and starter profiles), or this file.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml

permissions:
  contents: read

# Actions are pinned to a commit, as in ci.yml.

# A newer push to the same branch cancels the run it replaces, to save Actions minutes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info makes the build slower and the cache bigger, and CI never needs it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    runs-on: ubuntu-latest
    # About 5 minutes with the cache, 20 without. GitHub's default limit is 6 hours, which a
    # hung step would use up.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The Rust build embeds the window's built files, so build those first.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @lock-in/desktop build
        working-directory: .

      # What Tauri needs to build on Linux: the system webview and the menu-bar (tray) library.
      # Only what they depend on, not what they recommend (media plugins and the like).
      #
      # GitHub's runners download from Azure's copy of Ubuntu's mirror, which sometimes slows
      # to a trickle. So:
      # - The packages are cached, refreshed monthly. Any branch saves the cache when it has no
      #   copy yet for this month (a pull request's copy is only seen by that pull request; main's
      #   by everyone). Anything newer than the cache is still downloaded.
      # - If downloading takes over 2 minutes (it usually takes seconds), it stops and tries
      #   again from Ubuntu's own mirror, keeping what it has.
      # - Only the download is timed: stopping apt while it installs could leave packages half
      #   set up.
      - id: apt-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-packages
          key: apt-${{ runner.os }}-${{ steps.apt-month.outputs.month }}
          restore-keys: apt-${{ runner.os }}-
      - timeout-minutes: 12
        run: |
          packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev"
          sudo apt-get update
          if [ -d ~/apt-packages ]; then sudo cp ~/apt-packages/*.deb /var/cache/apt/archives/; fi
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get install -y --no-install-recommends --download-only \
              -o Acquire::Retries=3 $packages && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::Downloading packages failed or was slow, trying Ubuntu's own mirror"
            # The runner lists its mirrors in apt-mirrors.txt; older images name Azure's directly.
            for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              if [ -f "$file" ]; then sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$file"; fi
            done
            sudo apt-get update
          done
          sudo apt-get install -y --no-install-recommends $packages
          # Drop packages the mirror has replaced, so the cache doesn't grow month by month.
          sudo apt-get autoclean
          mkdir -p ~/apt-packages
          cp /var/cache/apt/archives/*.deb ~/apt-packages/
      - if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-packages
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy

      # Only main saves the cache; pull requests start from main's, so they don't fill the
      # repo's cache space with a copy each.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: TypeScript types match the Rust ones
        run: git diff --exit-code -- ../../../packages/core/src/generated

  # Rust dependencies: known security problems, licenses that fit AGPL-3.0, and crates only from
  # crates.io. The rules are in apps/desktop/src-tauri/deny.toml. Under a minute.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
