name: Desktop

# Building the Rust core takes a while, so this only runs when something it uses changes:
# the desktop app, packages/core (its generated types and starter profiles), or this file.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml

permissions:
  contents: read

# Actions are pinned to a commit, as in ci.yml.

# A newer push to the same branch cancels the run it replaces, to save Actions minutes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info makes the build slower and the cache bigger, and CI never needs it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    runs-on: ubuntu-latest
    # About 5 minutes with the cache, 20 without. GitHub's default limit is 6 hours, which a
    # hung step would use up.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # The Rust build embeds the window's built files, so build those first.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @lock-in/desktop build
        working-directory: .

      # What Tauri needs to build on Linux: the system webview and the menu-bar (tray) library.
      # Only what they depend on, not what they recommend (media plugins and the like), and a
      # few retries in case a mirror is slow.
      - timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy

      # Only main saves the cache; pull requests start from main's, so they don't fill the
      # repo's cache space with a copy each.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: TypeScript types match the Rust ones
        run: git diff --exit-code -- ../../../packages/core/src/generated

  # Rust dependencies: known security problems, licenses that fit AGPL-3.0, and crates only from
  # crates.io. The rules are in apps/desktop/src-tauri/deny.toml. Under a minute.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
